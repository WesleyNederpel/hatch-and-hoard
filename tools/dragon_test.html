<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dragon art and sound test</title>
<style>
  body { margin: 0; background: #2a2236; color: #eee; font-family: 'Trebuchet MS', Verdana, sans-serif; }
  #bar { padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: #1b1424; }
  button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 2px solid #5b4a78; background: #3a2d52; color: #fff; cursor: pointer; }
  button:hover { background: #55407a; }
  label { margin-left: 10px; }
  canvas { display: block; margin: 0 auto; max-width: 100%; height: auto; background: #8FD16A; }
</style>
</head>
<body>
<div id="bar">
  <b>Sounds:</b><span id="snd"></span>
  <label><input type="checkbox" id="mute"> mute</label>
  <label><input type="checkbox" id="sel"> selected glow</label>
  <label><input type="checkbox" id="ghost"> ghost</label>
  <label><input type="checkbox" id="zoom"> zoom 2x</label>
</div>
<canvas id="c" width="1100" height="920"></canvas>
<script src="../js/core/namespace.js"></script>
<script src="../js/data/config.js"></script>
<script src="../js/data/dragons.js"></script>
<script src="../js/data/evolutions.js"></script>
<script src="../js/render/art_dragons.js"></script>
<script src="../js/audio/sfx.js"></script>
<script>
(function () {
  var HH = globalThis.HH, art = HH.render.artDragons, cv = document.getElementById('c'), ctx = cv.getContext('2d');
  HH.audio.init();
  var bar = document.getElementById('snd');
  HH.audio.names.forEach(function (n) {
    var b = document.createElement('button'); b.textContent = n; b.onclick = function () { HH.audio.play(n); }; bar.appendChild(b);
  });
  document.getElementById('mute').onchange = function (e) { HH.audio.setMuted(e.target.checked); };
  var zoomOn = false;
  document.getElementById('zoom').onchange = function (e) { zoomOn = e.target.checked; cv.style.maxWidth = zoomOn ? "none" : ""; cv.style.width = zoomOn ? "2200px" : ""; };

  var types = ['ember', 'frost', 'venom'], items = [], id = 1, i, j;
  for (i = 0; i < 3; i++) for (j = 0; j < 3; j++)
    items.push({ id: id++, type: types[i], stage: j, form: null, x: 90 + j * 170, y: 100 + i * 150, label: types[i] + ' ' + ['Hatchling', 'Juvenile', 'Adult'][j] });
  var evo = Object.keys(HH.data.evolutions);
  evo.forEach(function (k, n) {
    var e = HH.data.evolutions[k];
    items.push({ id: id++, type: e.dragon, stage: 2, form: k, x: 90 + n * 170, y: 590, label: k });
  });
  // extra: ghost / selected preview dragon with null def
  items.forEach(function (d) { d.aim = 0; d.attackT = 9; d.next = 1 + (d.id % 5) * 0.4; d.def = HH.data.dragons[d.type]; });

  var last = performance.now(), t = 0;
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now; t += dt;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#8FD16A'; ctx.fillRect(0, 0, cv.width, cv.height);
    var sel = document.getElementById('sel').checked, ghost = document.getElementById('ghost').checked;
    ctx.font = '13px Trebuchet MS'; ctx.textAlign = 'center';
    items.forEach(function (d, n) {
      d.aim = t * 0.7 + d.id; d.attackT += dt; d.next -= dt;
      if (d.next <= 0) { d.attackT = 0; d.next = 1.6 + (d.id % 4) * 0.3; }
      art.draw(ctx, d, t, { selected: sel, ghost: ghost });
      ctx.fillStyle = '#1b1424'; ctx.fillText(d.label, d.x, d.y + 62);
    });
    // shop icons
    ctx.fillStyle = '#1b1424'; ctx.textAlign = 'left'; ctx.fillText('shop icons (44px / 90px)', 40, 700);
    types.forEach(function (ty, n) {
      ctx.fillStyle = '#4a3a62'; ctx.fillRect(40 + n * 70, 710, 44, 44); art.drawIcon(ctx, ty, 62 + n * 70, 732, 40);
      ctx.fillStyle = '#4a3a62'; ctx.fillRect(280 + n * 110, 710, 90, 90); art.drawIcon(ctx, ty, 325 + n * 110, 755, 84);
    });
    // preview-style fake dragon (id -1, def null, no stats)
    art.draw(ctx, { id: -1, type: 'frost', x: 760, y: 760, stage: 0, form: null, aim: 0.3, def: null, stats: null, attackT: 9 }, t, { ghost: true });
    ctx.fillStyle = '#1b1424'; ctx.fillText('placement preview', 710, 815);
    requestAnimationFrame(frame);
  }
  window.addEventListener('error', function (e) { document.title = 'ERROR ' + e.message; });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
